name: Vague

# Chaque jour après le studio : plans de lancement critiqués, tournoi, pages de test, porte de crédibilité,
# puis mise en ligne automatique (décision de Clément du 1er nov. 2026) des seules pages qui la franchissent.
# Mise en ligne seulement si : config/lancement.json auto=true, éditeur rempli, secrets Cloudflare présents.
on:
  workflow_run:
    workflows: ["Studio"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/lancement.json"] # modifier les réglages de lancement relance une vague sur le dernier studio

permissions:
  contents: write

concurrency:
  group: resultats
  cancel-in-progress: false

jobs:
  vague:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Vague du jour déjà faite ?
        run: |
          git fetch origin resultats || true
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.event }}" = "schedule" ] && git ls-tree --name-only origin/resultats "resultats/vagues/$(date -u +%F)/" 2>/dev/null | grep -q VAGUE.md; then
            echo "Vague du jour déjà faite."; echo "FAIT=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        if: env.FAIT != '1'
        run: npm test
      - name: Opportunités du dernier studio et mémoire des tests
        if: env.FAIT != '1'
        run: |
          mkdir -p /tmp/etat
          git fetch origin resultats
          dernier=$(git ls-tree --name-only origin/resultats resultats/studio/ | sort | tail -1)
          [ -n "$dernier" ] || { echo "Aucun passage du studio."; exit 1; }
          git show "origin/resultats:$dernier/opportunites.json" > /tmp/opportunites.json
          for f in lances propositions; do git show "origin/resultats:resultats/etat/$f.json" > "/tmp/etat/$f.json" 2>/dev/null || rm -f "/tmp/etat/$f.json"; done
          echo "Studio lu : $dernier"
      - name: Liste d'attente (seulement si Cloudflare est branché)
        if: env.FAIT != '1' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: infra/liste-attente
        run: |
          npx --yes wrangler@3 d1 create metis-experiences --location weur 2>/dev/null || true
          id=$(npx --yes wrangler@3 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const b=JSON.parse(s).find(x=>x.name==="metis-experiences");process.stdout.write(b?b.uuid:"")})')
          [ -n "$id" ] || { echo "Base D1 introuvable"; exit 1; }
          sed -i "s/A_RENSEIGNER/$id/" wrangler.toml
          npx --yes wrangler@3 d1 execute metis-experiences --remote --file=schema.sql
          # Un compte neuf n'a pas de sous-domaine workers.dev : on le réserve AVANT de déployer (sinon wrangler échoue).
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          lire_sub() { curl -s -H "$H" "$API/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).result?.subdomain||"")}catch{}})'; }
          sub=$(lire_sub)
          if [ -z "$sub" ]; then
            curl -s -X PUT -H "$H" -H "content-type: application/json" "$API/subdomain" -d "{\"subdomain\":\"metis-$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-8)\"}" | head -c 400; echo
            sub=$(lire_sub)
          fi
          echo "Sous-domaine workers.dev : ${sub:-aucun}"
          npx --yes wrangler@3 deploy 2>&1 | tee /tmp/deploy.txt || true
          curl -s -X POST -H "$H" -H "content-type: application/json" "$API/scripts/metis-liste-attente/subdomain" -d '{"enabled":true}' | head -c 300; echo
          [ -n "$sub" ] || { echo "Aucun sous-domaine workers.dev : à réserver une fois dans le tableau de bord (Workers & Pages)."; exit 1; }
          url="https://metis-liste-attente.$sub.workers.dev"
          echo "Liste d'attente : $url"
          echo "API_URL=$url" >> "$GITHUB_ENV"
      - name: Vague de lancement
        if: env.FAIT != '1'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/lancer-vague.js /tmp/opportunites.json /tmp/etat sortie
      - name: Mise en ligne des pages qui ont franchi la porte
        if: env.FAIT != '1' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          dossier=$(cat sortie/etat/vague-prete.txt 2>/dev/null || true)
          [ -n "$dossier" ] && [ -d "$dossier/site" ] || { echo "Rien à mettre en ligne."; exit 0; }
          npx --yes wrangler@3 pages project create metis-tests --production-branch main 2>/dev/null || true
          branche="vague-$(date -u +%Y-%m-%d)"
          npx --yes wrangler@3 pages deploy "$dossier/site" --project-name metis-tests --branch "$branche" --commit-dirty=true | tee /tmp/pages.txt
          base="https://$branche.metis-tests.pages.dev"
          { echo ""; echo "## En ligne"; for d in "$dossier"/site/*/; do s=$(basename "$d"); echo "- $base/$s/"; done; } | tee -a "$dossier/VAGUE.md" >> sortie/VAGUE-DU-JOUR.md
          printf '{"liste_attente_url": "%s", "pages": "%s"}\n' "$API_URL" "$base" > sortie/etat/infra.json
      - name: Dépôt des résultats
        if: always() && env.FAIT != '1'
        run: |
          [ -d sortie ] || exit 0
          # L'adresse de la liste d'attente est gardée dès que le Worker est déployé (les verdicts en ont besoin).
          if [ -n "$API_URL" ] && [ ! -f sortie/etat/infra.json ]; then mkdir -p sortie/etat; printf '{"liste_attente_url": "%s"}\n' "$API_URL" > sortie/etat/infra.json; fi
          cp -r sortie /tmp/sortie
          git reset -q --hard # wrangler.toml a été complété pendant le déploiement : on le remet avant de changer de branche
          git config user.name "metis-os"
          git config user.email "noreply@github.com"
          git checkout -B resultats origin/resultats
          mkdir -p resultats && cp -r /tmp/sortie/. resultats/
          git add resultats
          git commit -qm "Vague : passage ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do git push origin resultats && break; git pull --rebase -q origin resultats; done
