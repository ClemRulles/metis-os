name: Banc du passé

# Fait tourner le banc du passé sur GitHub, avec les clés rangées dans les secrets du dépôt.
# Personne ne voit les clés : ni le code, ni Métis, ni les journaux.
on:
  workflow_dispatch:
    inputs:
      nb_cas:
        description: "Nombre de cas à faire prédire"
        default: ""
  schedule:
    - cron: "17 */4 * * *" # toutes les 4 heures

permissions:
  contents: write # pour déposer les résultats sur la branche « resultats », lue par Métis

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: npm test
      - name: Collecte des cas résolus
        run: node scripts/collecter.js 60
      - name: Prédictions et notation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/lancer-banc.js "$(ls data/cas-show-hn-*.json | head -1)" "${{ github.event.inputs.nb_cas }}"
      - name: Résultats
        uses: actions/upload-artifact@v4
        with:
          name: banc-${{ github.run_id }}
          path: data/banc-*.json
          retention-days: 30
      - name: Dépôt des résultats pour Métis
        run: |
          mkdir -p /tmp/resultats && cp data/banc-*.json /tmp/resultats/
          git config user.name "metis-os"
          git config user.email "noreply@github.com"
          git fetch origin resultats || true
          if git rev-parse --verify -q origin/resultats >/dev/null; then
            git checkout -B resultats origin/resultats
          else
            git checkout --orphan resultats && git rm -rq --cached . && git clean -fdq -e /tmp
          fi
          mkdir -p resultats && cp /tmp/resultats/*.json resultats/
          git add resultats
          git commit -qm "Banc du passé : passage ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do git push origin resultats && break; git pull --rebase -q origin resultats; done
